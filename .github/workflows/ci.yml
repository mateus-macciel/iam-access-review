name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # weekly run (Mondays, 09:00 UTC)

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate synthetic data
        run: python src/generate_data.py --employees 400 --seed 42 --ref-date 2026-11-13 --out /tmp/data

      - name: Run access review
        run: python src/run_review.py --data /tmp/data --out output

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: access-review-reports
          path: output/
